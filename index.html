<title>블루 아카이브 학생 목록 (일본 서버 출시순)</title>
<style>
  :root { --bg:#f7f8fb; --card:#fff; --ink:#1d2330; --muted:#6b7385; --line:#e3e6ee; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; line-height:1.5; }
  header { max-width:1100px; margin:0 auto; padding:32px 20px 8px; }
  h1 { font-size:26px; margin:0 0 6px; letter-spacing:-0.02em; }
  .sub { color:var(--muted); font-size:14px; margin:0; }
  nav { position:sticky; top:0; z-index:5; background:rgba(247,248,251,.94); backdrop-filter:blur(6px);
        border-bottom:1px solid var(--line); }
  nav .in { max-width:1100px; margin:0 auto; padding:10px 20px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  nav a { text-decoration:none; color:var(--ink); background:var(--card); border:1px solid var(--line);
          padding:6px 14px; border-radius:999px; font-size:14px; font-weight:600; }
  nav a span.fc { font-size:11px; }
  nav a span { color:var(--muted); font-weight:500; margin-left:4px; }
  main { max-width:1100px; margin:0 auto; padding:8px 20px 60px; }
  section { margin-top:28px; }
  h2 { font-size:20px; margin:0 0 4px; }
  .desc { color:var(--muted); font-size:13px; margin:0 0 12px; }
  .grid { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .row { display:grid; grid-template-columns:34px 52px 100px 1fr 270px; gap:10px; align-items:baseline;
         padding:7px 14px; border-top:1px solid var(--line); font-size:15px; }
  .row:first-child { border-top:0; }
  .row.newdate { border-top:1px solid #cfd4e0; }
  .meta { display:flex; align-items:center; gap:6px; }
  .role { font-style:italic; font-weight:800; font-size:12px; letter-spacing:.01em; width:72px; font-family:"Arial Black",Arial,sans-serif; }
  .role.st { color:#E8322E; } .role.sp { color:#1B6FD6; }
  .meta .badge:nth-of-type(2){min-width:40px} .meta .badge:nth-of-type(3){min-width:64px}
  .cls { width:18px; height:18px; object-fit:contain; flex:none; }
  .badge { text-align:center; color:#fff; font-size:12px; font-weight:700; padding:2px 7px; border-radius:3px; line-height:1.4; white-space:nowrap; }
  .row { align-items:center; }
  .subtag { font-size:13px; font-weight:700; margin-left:12px; }
  .anniv { display:flex; align-items:center; gap:10px; padding:3px 14px; border-top:1px solid var(--line); background:linear-gradient(90deg,rgba(217,180,74,0),rgba(217,180,74,.07),rgba(217,180,74,0)); }
  .anniv::before, .anniv::after { content:""; flex:1; height:2px; background:#D9B44A; opacity:.85; }
  .anniv.a5 { background:linear-gradient(90deg,rgba(136,231,231,0),rgba(136,231,231,.10),rgba(136,231,231,0)); }
  .anniv.a5::before, .anniv.a5::after { background:#88E7E7; opacity:1; }
  .anniv.a5 span { color:#1F9A9A; }
  .anniv span { font-size:11px; font-weight:700; letter-spacing:.04em; color:#A07A1C; white-space:nowrap; }
  .anniv + .row { border-top:0; }
  .flt { font:inherit; color:inherit; background:none; border:1px solid transparent; border-radius:6px; padding:2px 6px; margin:-2px -4px; cursor:pointer; transition:opacity .15s, background .15s; }
  .flt:hover { background:rgba(0,0,0,.04); }
  .flt.on { background:#fff; border-color:#c9cfdc; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .flt.off { opacity:.35; }
  .legend .br { flex-basis:100%; height:0; }
  .legend .lg { color:var(--muted); }
  .legend .hint { font-size:12px; color:var(--muted); }
  .reset { font:inherit; font-size:13px; font-weight:600; color:#C8102E; background:#fff; border:1px solid #f0c3cb; border-radius:999px; padding:6px 12px; cursor:pointer; }
  .grid.empty { padding:16px; color:var(--muted); font-size:14px; }
  .pick { cursor:pointer; transition:transform .1s, box-shadow .1s; }
  .pick:hover { transform:translateY(-1px); }
  .pick.armed { box-shadow:0 0 0 2px #fff, 0 0 0 4px #1d2330; border-radius:3px; }
  .tip { position:absolute; z-index:20; max-width:calc(100vw - 16px); white-space:nowrap; background:#1d2330; color:#fff; font-size:12px; line-height:1.4; padding:6px 10px; border-radius:6px; box-shadow:0 4px 12px rgba(0,0,0,.18); pointer-events:none; opacity:0; transition:opacity .12s; }
  .tip.show { opacity:1; }
  .flt.ex { opacity:.45 !important; }
  .flt.ex, .flt.ex * { text-decoration:line-through; text-decoration-thickness:2px; }
  .flt.ex .badge, .flt.ex img { filter:grayscale(1); }
  .stars { display:inline-flex; gap:1px; vertical-align:middle; }
  .stars img { width:14px; height:14px; object-fit:contain; }
  .rar { justify-self:center; line-height:0; }
  .rar.pick { border-radius:3px; padding:1px; }
  .row.sub { border-top:0; padding-top:0; }
  .no { color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px; text-align:right; }
  .date { color:var(--muted); font-variant-numeric:tabular-nums; font-size:13px; }
  .row.samedate .date { visibility:hidden; }
  .nm { font-weight:700; }
  .tag { font-weight:500; color:var(--muted); font-size:13px; margin-left:6px; }
  .sch { font-size:12px; color:var(--muted); margin-left:8px; font-weight:400; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:14px; font-size:13px; }
  .legend b { font-weight:700; }
  .note { margin-top:18px; font-size:12.5px; color:var(--muted); background:var(--card); border:1px solid var(--line);
          border-radius:10px; padding:12px 14px; }
  .note li { margin:2px 0; }
  @media (max-width:760px){ .row{ grid-template-columns:22px 34px 80px 1fr; gap:4px 5px; padding:7px 10px; font-size:14px;} .date{white-space:nowrap;font-size:12px;letter-spacing:-.02em;} .meta{grid-column:4;} .role{width:auto;font-size:10px;margin-right:2px;} .cls{width:16px;height:16px;} .stars img{width:10px;height:10px;} .sch{font-size:11px;margin-left:5px;} }
</style>

const stars = n => `<span class="stars">${Array(n).fill(`<img src="${STAR}" alt="">`).join("")}</span>`;
const SUBLBL = {A:["아카이브","#14B89A"],E:["앙코르","#E3A21A"],R:["리콜렉트","#A35BD6"]};
const EXTRA = { "호시노(임전)":["STRIKER","神秘","重装甲","A"], "슌(수영복)":["STRIKER","振動","軽装備","A"] };
const NOTES = { "슌(수영복)":"슌/슈에린 형태 전환", "호시노(임전)":"탱커/어태커 형태 전환" };

const GROUPS = [
  { id:"perm", title:"통상", desc:"상시 모집(통상 모집·아카이브 모집) 대상 학생", test:r=>r.c==="P" },
  { id:"lim",  title:"한정", desc:"기간 한정 모집 학생 + 이벤트·미션 배포 학생(표기: (배포))", test:r=>r.c==="L"||r.c==="D" },
  { id:"fes",  title:"페스", desc:"주년·하프 주년 페스 모집 한정 학생", test:r=>r.c==="F" },
];

function sortRows(a,b){
  if (a.d!==b.d) return a.d<b.d?-1:1;
  const sa=SCHOOLS[a.s][0], sb=SCHOOLS[b.s][0];
  const c = sa.localeCompare(sb,"en",{sensitivity:"base"});
  return c!==0 ? c : 0; // 같은 날·같은 학교는 원래 입력 순서 유지
}

const main=document.getElementById("main"), nav=document.getElementById("nav");
main.insertAdjacentHTML("beforeend",`<div id="lists"></div>`);
const lists=document.getElementById("lists");

// 정렬 + 원래 순번 고정
const SORTED = GROUPS.map(g => RAW.filter(g.test).map((r,i)=>({...r,i})).sort((a,b)=>sortRows(a,b)||a.i-b.i).map((r,idx)=>({...r,no:idx+1})));

// 필터 상태: 같은 범주 안에서는 OR, 범주끼리는 AND
const F = { pos:new Set(), r:new Set(), s:new Set(), atk:new Set(), def:new Set(), cls:new Set(), sub:new Set() };
const X = { pos:new Set(), r:new Set(), atk:new Set(), def:new Set(), cls:new Set() };  // 목록에서 두 번 눌러 제외한 값
const forms = r => [[r.role,r.atk,r.def,r.cls]].concat(EXTRA[r.n]?[EXTRA[r.n]]:[]);
function pass(r){
  if (F.r.size && !F.r.has(String(rar(r)))) return false;
  if (X.r.has(String(rar(r)))) return false;
  if (F.s.size && !F.s.has(r.s)) return false;
  if (F.sub.size && !F.sub.has(SUB[r.n])) return false;
  const fs=forms(r);
  if (F.pos.size && !fs.some(f=>F.pos.has(f[0]))) return false;
  if (F.atk.size && !fs.some(f=>F.atk.has(f[1]))) return false;
  if (F.def.size && !fs.some(f=>F.def.has(f[2]))) return false;
  if (F.cls.size && !fs.some(f=>F.cls.has(f[3]))) return false;
  if (fs.some(f=>X.pos.has(f[0])||X.atk.has(f[1])||X.def.has(f[2])||X.cls.has(f[3]))) return false;
  return true;
}
const anyFilter = () => Object.values(F).some(x=>x.size) || Object.values(X).some(x=>x.size);

const meta = (rl,at,df,cl) => {
  const ico = `<img class="cls pick" data-g="cls" data-k="${cl}" src="${ICON[cl]}" alt="${CLSNAME[cl]}">`;
  const role = `<span class="role ${rl==="STRIKER"?"st":"sp"} pick" data-g="pos" data-k="${rl}">${rl}</span>`;
  const [ak,ac]=ATK[at], [dk,dc]=DEF[df];
  return `<span class="meta">${ico}${role}<span class="badge pick" data-g="atk" data-k="${at}" style="background:${ac}">${ak}</span><span class="badge pick" data-g="def" data-k="${df}" style="background:${dc}">${dk}</span></span>`;
};

function render(){
  let total=0, navHtml="";
  let out="";
  GROUPS.forEach((g,gi)=>{
    const all=SORTED[gi], rows=all.filter(pass);
    total+=rows.length;
    const cnt = anyFilter() ? `${rows.length} / ${all.length}명` : `${all.length}명`;
    navHtml += `<a href="#${g.id}">${g.title}${anyFilter()? `<span class="fc">${rows.length}/${all.length}</span>` : `<span>${all.length}</span>`}</a>`;
    let html = `<section id="${g.id}"><h2>${g.title} <span style="color:var(--muted);font-weight:500;font-size:15px">(${cnt})</span></h2><p class="desc">${g.desc}</p>`;
    if (!rows.length) { out += html + `<div class="grid empty">조건에 맞는 학생이 없습니다.</div></section>`; return; }
    html += `<div class="grid">`;
    let prev="";
    rows.forEach((r,idx)=>{
      if (idx) for (let y=2022; y<=2030; y++) {
        const a = `${y}-02-04`;
        if (prev < a && r.d >= a) {
          const n=y-2021, ord = n===1?"1st":n===2?"2nd":n===3?"3rd":`${n}th`;
          html += `<div class="anniv${n===5?" a5":""}"><span>${ord} Anniversary · ${a}</span></div>`;
        }
      }
      const [en,ko,col]=SCHOOLS[r.s];
      const cls = r.d===prev ? "samedate" : (idx? "newdate":"");
      const tag = r.c==="D" ? `<span class="tag">(배포)</span>` : "";
      const note = NOTES[r.n] ? `<span class="tag">· ${NOTES[r.n]}</span>` : "";
      const sub = SUB[r.n] ? `<span class="subtag" style="color:${SUBLBL[SUB[r.n]][1]}">${SUBLBL[SUB[r.n]][0]}</span>` : "";
      html += `<div class="row ${cls}"><span class="no">${r.no}</span><span class="rar pick" data-g="r" data-k="${rar(r)}">${stars(rar(r))}</span><span class="date">${r.d}</span><span class="who"><span class="nm" style="color:${col}">${r.n}</span>${note}<span class="sch">${ko}</span>${sub}${tag}</span>${meta(r.role,r.atk,r.def,r.cls)}</div>`;
      if (EXTRA[r.n]) html += `<div class="row sub"><span class="no"></span><span class="rar"></span><span class="date"></span><span class="who"></span>${meta(...EXTRA[r.n])}</div>`;
      prev=r.d;
    });
    out += html+"</div></section>";
  });
  lists.innerHTML = out;
  nav.innerHTML = navHtml
    + (anyFilter()? `<button class="reset" id="reset">필터 초기화</button>` : "")
    + `<span style="color:var(--muted);font-size:13px;margin-left:auto">${anyFilter()? `표시 ${total} / ` : ""}총 ${RAW.length}명</span>`;
  const rb=document.getElementById("reset"); if (rb) rb.onclick=()=>{ Object.values(F).forEach(x=>x.clear()); Object.values(X).forEach(x=>x.clear()); render(); };
  // 범례 선택 상태 표시
  document.querySelectorAll("#legend .flt").forEach(el=>{
    const set=F[el.dataset.g], ex=X[el.dataset.g]&&X[el.dataset.g].has(el.dataset.k);
    el.classList.toggle("ex", !!ex);
    el.classList.toggle("on", set.has(el.dataset.k));
    el.classList.toggle("off", !ex && set.size>0 && !set.has(el.dataset.k));
  });
}

const chip = (g,k,inner) => `<button type="button" class="flt" data-g="${g}" data-k="${k}">${inner}</button>`;
document.getElementById("legend").innerHTML =
    Object.entries(SCHOOLS).map(([k,[en,ko,col]])=>chip("s",k,`<b style="color:${col}">■ ${ko}</b> <span style="color:var(--muted)">${en}</span>`)).join("")
  + `<span class="br"></span>`
  + `<span class="lg">공격</span>` + Object.entries(ATK).map(([k,[l,c]])=>chip("atk",k,`<span class="badge" style="background:${c}">${l}</span>`)).join("")
  + `<span class="lg" style="margin-left:10px">방어</span>` + Object.entries(DEF).map(([k,[l,c]])=>chip("def",k,`<span class="badge" style="background:${c}">${l}</span>`)).join("")
  + `<span class="br"></span><span class="lg">역할</span>` + Object.entries(CLSNAME).map(([k,v])=>chip("cls",k,`<span style="display:inline-flex;align-items:center;gap:4px"><img class="cls" src="${ICON[k]}" alt="">${v}</span>`)).join("")
  + `<span class="lg" style="margin-left:18px">포지션</span>` + ["STRIKER","SPECIAL"].map(k=>chip("pos",k,`<span class="role ${k==="STRIKER"?"st":"sp"}" style="width:auto">${k}</span>`)).join("")
  + `<span class="br"></span><span class="lg">레어도</span>` + [1,2,3].map(n=>chip("r",String(n),`${stars(n)} <span style="color:var(--muted)">${n}성</span>`)).join("")
  + `<span class="br"></span><span class="lg">하위 등급</span>` + Object.entries(SUBLBL).map(([k,[l,c]])=>chip("sub",k,`<span style="color:${c};font-weight:700">${l}</span> <span style="color:var(--muted)">(${{A:"통상",E:"한정",R:"페스"}[k]})</span>`)).join("")
  + `<span class="br"></span><span class="hint">범례를 누르면 해당 항목만 필터링됩니다. 목록의 별·역할 아이콘·STRIKER/SPECIAL·공격/방어 타입을 두 번 누르면 그 값을 가진 학생이 목록에서 빠지고, 범례에 취소선이 표시됩니다(취소선 항목을 누르면 되돌아옵니다).</span>`;
document.getElementById("legend").addEventListener("click", e=>{
  const el=e.target.closest(".flt"); if(!el) return;
  const set=F[el.dataset.g], k=el.dataset.k;
  if (X[el.dataset.g] && X[el.dataset.g].has(k)) { X[el.dataset.g].delete(k); render(); return; }
  set.has(k) ? set.delete(k) : set.add(k);
  render();
});
// 목록 안 타입/역할: 1번 클릭 → 경고, 같은 레이어를 1번 더 클릭 → 필터 적용
const WARN = { pos:"이 레이어를 한번 더 누르면 해당 전후열이 필터링됩니다", r:"이 레이어를 한번 더 누르면 해당 성급이 필터링됩니다", atk:"이 레이어를 한번 더 누르면 해당 공격타입이 필터링됩니다", def:"이 레이어를 한번 더 누르면 해당 방어타입이 필터링됩니다", cls:"이 레이어를 한번 더 누르면 해당 역할이 필터링됩니다" };
const tip=document.createElement("div"); tip.className="tip"; document.body.appendChild(tip);
let armed=null, tipTimer=null;
function hideTip(){ tip.classList.remove("show"); if(armed) armed.classList.remove("armed"); armed=null; clearTimeout(tipTimer); }
lists.addEventListener("click", e=>{
  const el=e.target.closest(".pick"); if(!el) return;
  e.stopPropagation();
  if (armed===el) { const g=el.dataset.g,k=el.dataset.k; X[g].add(k); F[g].delete(k); hideTip(); render(); return; }
  hideTip();
  armed=el; el.classList.add("armed");
  tip.textContent=WARN[el.dataset.g];
  const r=el.getBoundingClientRect();
  tip.classList.add("show");
  const w=tip.offsetWidth;
  let x=r.left+r.width/2-w/2; x=Math.max(8,Math.min(x,window.innerWidth-w-8));
  tip.style.left=(x+window.scrollX)+"px"; tip.style.top=(r.top+window.scrollY-tip.offsetHeight-8)+"px";
  tipTimer=setTimeout(hideTip,4000);
});
document.addEventListener("click", e=>{ if(!e.target.closest(".pick")) hideTip(); });
window.addEventListener("scroll", ()=>{ if(armed) hideTip(); }, {passive:true});
render();

main.insertAdjacentHTML("beforeend",`<div class="note"><b>참고</b><ul>
<li>날짜는 일본 서버에서 해당 학생이 처음 모집(또는 배포)된 날입니다. 서비스 개시일(2021-02-04)부터 있던 학생은 모두 2021-02-04로 표기했습니다.</li>
